# =============================================================================
# REUSABLE TEMPLATE - "Component standard request"
# Request-specific values come from the request file front matter via {{variables}}.
# =============================================================================

document_title: "Component standard request: {{component}}"
numbering: true        # prints "1. Component Summary", "2. Purpose" ... (false = titles exactly as written)

purpose: >
  Produce a component-standard request that the Enterprise Technology (ET) architecture review will
  assess. The document must support the decision and outcome requested in the request context and
  stay consistent with its requirements and constraints.

required_vars: [component]          # the request file MUST define these
defaults:                           # used when the request file does not define them
  reference_urls: []
  attachments: []
  policy_documents: []              # corporate policy / governance files used by the Use Cases section

writer_guidelines: |
  - Audience: enterprise architecture review board. Factual and concise, no marketing language.
  - Use the request context [R1] as the primary source of truth; use [E..] evidence for product facts.
  - Do not invent figures, costs, dates or capabilities. State explicitly what is unknown.
  - About 150 to 400 words per section unless the section guidelines say otherwise.

key_facts:                          # reported by every agent; disagreements are flagged automatically
  - component_name
  - replaces
  - target_platform
  - alternatives_evaluated
  - deciding_requirement

source_precedence: [request, file, docs, m365, url, web]   # highest authority first
max_revision_rounds: 1

# =============================================================================
# DOCUMENT OUTLINE - the order below IS the order of the final document.
#   title       printed exactly as written (numbered automatically if numbering: true)
#   directives  what the agent must cover; one item per line, each one checked in the final review
#   sources     extra sources of truth; the request text [R1] is always included
#   depends_on  changes WHEN an agent runs, never WHERE its section appears
#   table_columns  makes the section a table with exactly these columns (drawn by the script)
#   retrieval_keywords  extra words used to pick the relevant passages from the official docs
#
# Official documentation (type: docs): only the listed URLs are fetched. With recursive: true, linked
# pages under the same address are collected too (e.g. .../s3-files.html -> .../s3-files-quotas.html).
# Each agent then receives only the passages relevant to its section. See README "Official documentation".
# =============================================================================
sections:

  - id: component_summary
    title: "Component Summary"
    directives: |
      Summarize what the component is and which current solution it replaces.
      State the decision requested from ET.
    depends_on: [purpose, drivers_motivation, business_value]   # runs last, printed first
    guidelines: |
      - One paragraph, at most 150 words.
      - Summarize what the other sections establish; do not introduce new facts.

  - id: purpose
    title: "Purpose"
    directives: |
      Describe the business problem this request addresses.
      State the outcome and deliverables requested from ET.
      Identify the impacted business unit and the key constraints (platform, deadlines, budget).

  - id: drivers_motivation
    title: "Overview: Drivers and Motivation"
    directives: |
      Describe what the component is.
      Describe the motivation for using the component.
      Explain what distinguishes the component from others that were evaluated or are in use within the enterprise.
    sources:
      - type: docs                  # official documentation: URLs from the requirements file
        urls: "{{reference_urls}}"
        recursive: true             # also collect linked pages under the same address
      - type: file                  # optional attachments (PDF, DOCX, MD ...)
        paths: "{{attachments}}"
    retrieval_keywords: "overview introduction features how it works architecture protocol compared"
      # Enterprise catalogue, to compare with components already in use (needs M365 Copilot licence):
      # - type: m365
      #   query: "Which file storage and S3 access components are approved standards?"
      #   filter_expression: 'path:"https://yourtenant.sharepoint.com/sites/ArchitectureStandards/"'

  - id: use_cases
    title: "Use Cases"
    directives: |
      List the use cases for which the component is accepted, based on the requirements and scope and the Overview section.
      Keep only use cases that are aligned with the corporate policy and governance found in the sources.
      If no policy or governance source is available, add an open question that policy alignment must be confirmed.
    table_columns: ["Title", "Description"]
    depends_on: [drivers_motivation]        # receives the finished "Overview: Drivers and Motivation" section
    sources:
      - type: docs
        urls: "{{reference_urls}}"
        recursive: true
      - type: file
        paths: "{{policy_documents}}"       # corporate policy and governance documents, if provided
      # Policy and governance pages from SharePoint (needs M365 Copilot licence):
      # - type: m365
      #   query: "What are the corporate policies and governance rules for cloud storage and data access?"
      #   filter_expression: 'path:"https://yourtenant.sharepoint.com/sites/Governance/"'
    guidelines: |
      - Short phrases only. Title: 2 to 6 words. Description: one sentence, at most 20 words.
      - 3 to 8 rows, most important first. Accepted use cases only, no rejected or future ones.
      - No implementation details; those belong to other sections.
    retrieval_keywords: "use cases workloads supported unsupported limits quotas performance"

  - id: business_value
    title: "Business Value"
    directives: |
      Describe the business value for the component.
      Why should this component be introduced as a component standard within the organization?
      What value is gained by having the component approved for use within the enterprise?
    sources:
      - type: docs
        urls: "{{reference_urls}}"
        recursive: true
      - type: file
        paths: "{{attachments}}"
    retrieval_keywords: "pricing cost performance scalability durability availability operations management"
    guidelines: |
      - Tie each value statement to a business need, constraint or success criterion in the request context.
      - Do not repeat the product description; it belongs to "Overview: Drivers and Motivation".
